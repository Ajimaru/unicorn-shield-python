version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    # Patch bumps are ignored to keep PR volume low; security fixes still
    # arrive through Dependabot security alerts, which ignore this filter.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"

# pip is deliberately NOT watched here.
#
# coding-unicorn-shield-projects/http-api/requirements.txt targets a Raspberry
# Pi 1 Model B+ (armv6l) running Raspbian 10 buster, whose system interpreter is
# Python 3.7.3. Flask 3.x and Flask-Cors 6.x both declare requires_python >=3.9,
# so a Dependabot bump produces a release that cannot be installed on the target
# hardware at all — pip on the Pi does not even list those versions as
# candidates. PR #2 ("Bump the pip group across 1 directory with 2 updates",
# Flask 0.12.2 -> 3.1.3, Flask-Cors 3.0.3 -> 6.0.0) was exactly that case and
# was closed unmerged.
#
# The highest Flask that still supports Python 3.7 is 2.2.5. The host currently
# runs Flask 2.0.3 / Flask-Cors 3.0.10, installed system-wide (no venv), and the
# service runs as /usr/bin/python3 /home/pi/unicorn_api.py.
#
# Security advisories for these packages still reach the repo through Dependabot
# security alerts, which are configured separately and are not affected by this
# file.
